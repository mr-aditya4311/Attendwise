<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff7a1a">
  <meta name="robots" content="noindex">
  <title>Offline – AttendWise</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/pwa.css">
</head>
<body>
  <main class="offline-page container" id="main">
    <div class="glass offline-card">
      <span class="brand-mark" aria-hidden="true">A</span>
      <h1>You're offline</h1>
      <p>AttendWise needs a connection to load this page for the first time. Your saved settings and history stay on this device.</p>
      <p>Reconnect and try again. Pages you already opened may still work offline.</p>
      <button type="button" class="btn-primary" onclick="location.reload()">Try again</button>
      <a class="btn-secondary" href="/">Go to AttendWise</a>
    </div>
  </main>
</body>
</html>
